<html lang="vi" data-theme="dark">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xem thử: menu avatar + quét view</title>
<style>
:root { color-scheme:light; --bg:#f6f4fa; --card:#ffffff; --line:#e6e1f0; --txt:#2d2a3a; --dim:#675f80; --org:#6a58a6; --sel:#6a58a6; --on-sel:#ffffff; --ok:#166534; --bad:#b91c1c; --brand:#dd7424; --warn:#b45309; --field:#ffffff; --soft:rgba(106,88,166,.12); --okbg:#e8f7ee; --badbg:#fdeeee; --warnbg:#fff3e0; --shadow:0 1px 2px rgba(40,30,70,.05),0 6px 18px rgba(40,30,70,.07); }
:root[data-theme="dark"] { color-scheme:dark; --bg:#1e2220; --card:#272c2a; --line:#3a413e; --txt:#e9ece8; --dim:#aab3ad; --sel:#7fb69a; --on-sel:#0f1f18; --ok:#34d399; --bad:#fca5a5; --brand:#f0954f; --warn:#fbbf24; --field:#2f3532; --soft:rgba(127,182,154,.14); --okbg:rgba(52,211,153,.12); --badbg:rgba(248,113,113,.12); --warnbg:rgba(251,191,36,.12); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
body { min-height:100vh; }
.app { max-width:430px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:30px; overflow-x:hidden; }
header { position:sticky; top:0; z-index:20; background:var(--bg); padding:12px 16px 8px; display:flex; align-items:center; gap:10px; }
.av { position:relative; flex:none; width:48px; height:48px; border-radius:16px; border:1px solid var(--line); background:var(--card); color:var(--brand); display:inline-flex; align-items:center; justify-content:center; padding:0; cursor:pointer; box-shadow:var(--shadow); }
.av .bd { position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; padding:0 5px; border-radius:99px; background:var(--brand); color:#1a1208; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid var(--bg); }
.av .bars { position:absolute; bottom:-5px; right:-5px; width:20px; height:20px; border-radius:50%; background:var(--sel); color:var(--on-sel); display:flex; align-items:center; justify-content:center; border:2px solid var(--bg); }
h1 { margin:0; font-size:15px; letter-spacing:.2px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } h1 span { color:var(--brand); }
.hb { display:flex; gap:6px; } .ib { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--txt); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
.tip { position:absolute; top:62px; left:14px; z-index:25; background:var(--sel); color:var(--on-sel); font-size:13px; font-weight:700; padding:8px 12px; border-radius:12px; box-shadow:var(--shadow); animation:bob 1.6s ease-in-out infinite; }
.tip::before { content:""; position:absolute; top:-6px; left:20px; border:6px solid transparent; border-top:0; border-bottom-color:var(--sel); }
@keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(3px); } }
main { padding:6px 16px 16px; }
h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:18px 0 8px; font-weight:600; }
.seg { display:flex; gap:4px; padding:4px; background:var(--soft); border-radius:99px; margin:4px 0 12px; } .seg button { flex:1; min-height:42px; border:0; border-radius:99px; background:none; color:var(--dim); font:inherit; font-weight:600; cursor:pointer; } .seg button.on { background:var(--sel); color:var(--on-sel); font-weight:700; }
.box { background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:10px; box-shadow:var(--shadow); overflow:hidden; }
.bh { display:flex; align-items:center; gap:8px; padding:12px 14px; font-weight:700; min-height:44px; cursor:pointer; } .bh small { flex:1; text-align:right; font-weight:400; color:var(--dim); }
.bb { padding:0 14px 14px; display:none; } .box.open .bb { display:block; } .box.open .bh svg { transform:rotate(180deg); }
.kavs { display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px; } .kav { flex:none; width:64px; text-align:center; font-size:11px; color:var(--dim); } .kav i { display:flex; width:50px; height:50px; margin:0 auto 4px; border-radius:50%; background:var(--soft); border:2px solid var(--line); align-items:center; justify-content:center; font-style:normal; font-weight:700; font-size:19px; color:var(--sel); } .kav.on i { border-color:var(--sel); } .kav.on { color:var(--txt); font-weight:700; }
.fg { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .fg label { display:block; font-size:12px; color:var(--dim); } .fg select { width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:12px; background:var(--field); color:var(--txt); font:inherit; margin-top:3px; }
.sum { font-size:13px; color:var(--dim); margin:2px 2px 10px; } .sum b { color:var(--txt); }
.clip { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow); }
.c1 { display:flex; align-items:center; gap:8px; font-size:13px; } .c1 b { color:var(--sel); font-size:15px; } .c1 .tr { font-weight:700; } .c1 .ch { margin-left:auto; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:42%; }
.c2 { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-top:6px; } .big { font-size:24px; font-weight:800; line-height:1; } .big small { font-size:12px; font-weight:600; color:var(--dim); margin-left:4px; } .spd { text-align:right; font-weight:800; color:var(--ok); font-size:17px; line-height:1; } .spd small { display:block; font-size:11px; font-weight:600; color:var(--dim); margin-top:3px; }
.c3 { display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--dim); } .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-weight:700; background:var(--warnbg); color:var(--warn); } .cart { margin-left:6px; }
.hist { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:10px; padding-top:8px; border-top:1px solid var(--line); } .hc { text-align:center; min-width:0; } .hc small { display:block; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.03em; } .hc b { display:block; font-size:14px; margin-top:2px; } .hc em { display:block; font-style:normal; font-size:11px; color:var(--ok); margin-top:1px; min-height:14px; } .hc.na b { color:var(--dim); font-weight:400; } .hc.last b { color:var(--sel); }
.note { font-size:12px; color:var(--dim); text-align:center; margin:14px 0 4px; }
.ph { text-align:center; color:var(--dim); padding:60px 20px; border:1px dashed var(--line); border-radius:16px; margin-top:12px; }
.ic { display:block; }
/* menu kéo từ avatar */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .22s; z-index:40; }
.drawer { position:fixed; top:0; bottom:0; left:max(0px, calc(50vw - 215px)); width:min(78vw, 300px); background:var(--card); border-right:1px solid var(--line); transform:translateX(-105%); visibility:hidden; transition:transform .25s cubic-bezier(.3,.9,.3,1), visibility 0s .25s; z-index:50; padding:18px 12px; display:flex; flex-direction:column; box-shadow:var(--shadow); }
.open-d .scrim { opacity:1; pointer-events:auto; } .open-d .drawer { transform:translateX(0); visibility:visible; transition:transform .25s cubic-bezier(.3,.9,.3,1), visibility 0s; }
.dh { display:flex; align-items:center; gap:10px; padding:4px 8px 16px; border-bottom:1px solid var(--line); margin-bottom:8px; } .dh .lg { color:var(--brand); } .dh b { font-size:14px; line-height:1.2; } .dh small { display:block; color:var(--dim); font-size:11px; font-weight:400; }
.it { display:flex; align-items:center; gap:14px; width:100%; min-height:54px; padding:0 12px; border:0; border-radius:14px; background:none; color:var(--txt); font:inherit; font-size:16px; cursor:pointer; text-align:left; } .it.on { background:var(--soft); color:var(--sel); font-weight:700; } .it .n { margin-left:auto; min-width:24px; height:22px; padding:0 7px; border-radius:99px; background:var(--brand); color:#1a1208; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.df { margin-top:auto; font-size:12px; color:var(--dim); padding:10px 8px 0; border-top:1px solid var(--line); }
.mock { font-size:11px; text-align:center; color:var(--dim); padding:6px 0 0; }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="av" id="avBtn" aria-label="Mở menu"><span class="lg" id="logo"></span><span class="bd" id="avBd">53</span><span class="bars" id="avBars"></span></button>
    <h1>QUANG VING <span>PHỐI ĐỒ</span></h1>
    <div class="hb"><button class="ib" id="thBtn" aria-label="Sáng tối"></button><button class="ib" id="gearBtn" aria-label="Cài đặt"></button></div>
  </header>
  <div class="tip" id="tip">Chạm avatar để mở menu</div>
  <div class="mock">BẢN VẼ THỬ - dữ liệu mẫu, chưa nối vào bảng điều khiển thật</div>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Menu">

</aside>
